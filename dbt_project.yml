name: 'sleep_analytics'
version: '1.0.0'
config-version: 2

profile: 'sleep_analytics'

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
clean-targets:
  - "target"
  - "dbt_packages"

vars:
  epoch_length_seconds: 30
  # A continuous wake bout at least this long splits one sleep episode from the
  # next, so that daytime naps are not folded into the main sleep period.
  sleep_episode_gap_minutes: 60

models:
  sleep_analytics:
    +materialized: view
    marts:
      +materialized: table
flags:
  require_generic_test_arguments_property: true
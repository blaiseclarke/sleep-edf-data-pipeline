sleep_analytics:
  # DuckDB is the default so the documented local flow (`dbt debug/build
  # --profiles-dir .` against a stock .env) works out of the box. The pipeline
  # and CI always pass an explicit --target; use `--target dev` for Snowflake.
  target: dev_duckdb
  outputs:
    dev:
      type: snowflake
      account: "{{ env_var('SNOWFLAKE_ACCOUNT') }}"
      user: "{{ env_var('SNOWFLAKE_USER') }}"
      password: "{{ env_var('SNOWFLAKE_PASSWORD') }}"
      role: "{{ env_var('SNOWFLAKE_ROLE') }}"
      warehouse: "{{ env_var('SNOWFLAKE_WAREHOUSE') }}"
      database: "{{ env_var('SNOWFLAKE_DATABASE') }}"
      schema: "{{ env_var('SNOWFLAKE_SCHEMA') }}"
      threads: 4

    dev_duckdb:
      type: duckdb
      path: "{{ env_var('DB_PATH', 'data/sleep_data.db') }}"
      schema: main
      threads: 1